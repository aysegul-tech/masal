---
layout: default
---
<article class="masal">
  <h1>{{ page.title }}</h1>
  {% if page.ozet %}<p class="ozet">{{ page.ozet }}</p>{% endif %}

  <!-- Masal metni. JavaScript bunu sayfalara böler; çalışmazsa olduğu gibi okunur. -->
  <div class="metin" id="metin">
    {{ content }}
  </div>

  <div class="kitap" id="kitap" hidden>
    <figure class="sahne">
      <img id="sahne-resim" alt="">
    </figure>
    <div class="sahne-metin" id="sahne-metin" aria-live="polite"></div>

    <nav class="sayfa-nav" aria-label="Sayfalar">
      <button type="button" id="onceki" aria-label="Önceki sayfa">←</button>
      <span id="sayfa-no">1 / 1</span>
      <button type="button" id="sonraki" aria-label="Sonraki sayfa">→</button>
    </nav>
  </div>

  <p class="geri"><a href="{{ '/' | relative_url }}">← Tüm masallar</a></p>
</article>

<button type="button" class="ses-dugme" id="ses-dugme" aria-pressed="false" hidden>
  <span class="ikon" aria-hidden="true">🔈</span>
  <span class="yazi">Sesli oku</span>
</button>

<script src="{{ '/assets/kitap.js' | relative_url }}" defer></script>
